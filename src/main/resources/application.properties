spring.application.name=Rizq

# ---- MySQL ----
# Create the DB first:  CREATE DATABASE rizq_db CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/rizq_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Dhaka
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
server.port=8080

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
