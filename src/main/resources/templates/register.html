<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container auth-wrap">
  <div class="form">
    <h1 class="center" style="margin-top:0">Create your account</h1>
    <p class="muted center">Join Rizq as a donor or an NGO.</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" method="post" th:object="${user}">
      <label for="fullName">Full name / Organization</label>
      <input id="fullName" type="text" th:field="*{fullName}"/>
      <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

      <label for="email">Email</label>
      <input id="email" type="email" th:field="*{email}"/>
      <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

      <label for="password">Password</label>
      <input id="password" type="password" th:field="*{password}"/>
      <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

      <div class="form-row">
        <div>
          <label for="phone">Phone</label>
          <input id="phone" type="text" th:field="*{phone}" placeholder="+880 17XX-XXXXXX"/>
        </div>
        <div>
          <label for="city">City</label>
          <select id="city" th:field="*{city}">
            <option value="Dhaka">Dhaka</option>
            <option value="Chattogram">Chattogram</option>
            <option value="Sylhet">Sylhet</option>
            <option value="Khulna">Khulna</option>
            <option value="Rajshahi">Rajshahi</option>
          </select>
        </div>
      </div>

      <label for="accountType">I am registering as</label>
      <select id="accountType" name="accountType">
        <option value="DONOR">Donor (individual or business)</option>
        <option value="NGO">NGO / Charity</option>
      </select>

      <button type="submit" class="btn btn-primary mt-2" style="width:100%">Create Account</button>
    </form>

    <p class="center mt-2 muted">Already registered? <a th:href="@{/login}" style="color:var(--primary-dark);font-weight:600">Sign in</a></p>
  </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
